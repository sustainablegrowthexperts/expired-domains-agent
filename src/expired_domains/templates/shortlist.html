function renderSeg(prefilterView, keywordView, collectionView, drView, liveView, waybackView, evaluationView) {
  const seg = document.getElementById('seg');
  if (!prefilterView && !keywordView && !drView && !liveView && !waybackView && !collectionView && !evaluationView) {
    seg.hidden = true;
    return;
  }
  const base = ROWS.filter(row =>
    !row.blocked && row.prefilter && nicheMatch(row) && (st.src === 'all' || row.source === st.src)
  );
  if (evaluationView) {
    const eligible = ROWS.filter(row =>
      !row.blocked && row.evaluation && nicheMatch(row)
      && (st.src === 'all' || row.source === st.src)
    );
    const counts = {passed: 0, failed: 0};
    for (const row of eligible) {
      const bucket = evaluationBucket(row);
      if (bucket === 'passed' || bucket === 'failed') counts[bucket] += 1;
    }
    seg.innerHTML = Object.entries(EVALUATION_FILTERS).map(([key, label]) =>
      `<button type="button" data-eres="${key}" aria-pressed="${st.eres === key}">`
      + `${label}<span class="num">${counts[key].toLocaleString()}</span></button>`
    ).join('');
    seg.hidden = false;
    return;
  }
  if (collectionView) {
    const eligible = base.filter(row => row.collection && row.collection.eligible);
    const counts = {queued: 0, collected: 0, failed: 0};
    for (const row of eligible) counts[row.collection.status] += 1;
    seg.innerHTML = Object.entries(COLLECTION_FILTERS).map(([key, label]) =>
      `<button type="button" data-cres="${key}" aria-pressed="${st.cres === key}">`
      + `${label}<span class="num">${counts[key].toLocaleString()}</span></button>`
    ).join('');
    seg.hidden = false;
    return;
  }
  if (drView) {
    const eligible = base.filter(row =>
      row.prefilter.pass && row.keyword_check && row.keyword_check.reusable
    );
    const counts = {processing: 0, passed: 0, failed: 0};
    for (const row of eligible) counts[drBucket(row)] += 1;
    seg.innerHTML = Object.entries(DR_FILTERS).map(([key, label]) =>
      `<button type="button" data-dres="${key}" aria-pressed="${st.dres === key}">`
      + `${label}<span class="num">${counts[key].toLocaleString()}</span></button>`
    ).join('');
    seg.hidden = false;
    return;
  }
  if (liveView) {
    const eligible = base.filter(row =>
      row.prefilter.pass && row.keyword_check && row.keyword_check.reusable
      && row.dr_check && row.dr_check.passed
    );
    const counts = {processing: 0, passed: 0, failed: 0};
    for (const row of eligible) counts[liveBucket(row)] += 1;
    seg.innerHTML = Object.entries(LIVE_FILTERS).map(([key, label]) =>
      `<button type="button" data-lres="${key}" aria-pressed="${st.lres === key}">`
      + `${label}<span class="num">${counts[key].toLocaleString()}</span></button>`
    ).join('');
    seg.hidden = false;
    return;
  }
  if (waybackView) {
    const eligible = base.filter(row =>
      row.prefilter.pass && row.keyword_check && row.keyword_check.reusable
      && row.dr_check && row.dr_check.passed
    );
    const counts = {processing: 0, passed: 0, failed: 0, connection_failed: 0};
    for (const row of eligible) counts[waybackBucket(row)] += 1;
    seg.innerHTML = Object.entries(WAYBACK_FILTERS).map(([key, label]) =>
      `<button type="button" data-wres="${key}" aria-pressed="${st.wres === key}">`
      + `${label}<span class="num">${counts[key].toLocaleString()}</span></button>`
    ).join('');
    seg.hidden = false;
    return;
  }
  if (keywordView) {
    const eligible = base.filter(row => row.prefilter.pass);
    const counts = {processing: 0, passed: 0, failed: 0};
    for (const row of eligible) counts[keywordBucket(row)] += 1;
    seg.innerHTML = Object.entries(KEYWORD_FILTERS).map(([key, label]) =>
      `<button type="button" data-kres="${key}" aria-pressed="${st.kres === key}">`
      + `${label}<span class="num">${counts[key].toLocaleString()}</span></button>`
    ).join('');
    seg.hidden = false;
    return;
  }
  const counts = {
    pass: base.filter(row => row.prefilter.pass).length,
    fail: base.filter(row => !row.prefilter.pass).length
  };
  seg.innerHTML = [['pass', 'Passed'], ['fail', 'Failed']].map(([key, label]) =>
    `<button type="button" data-res="${key}" aria-pressed="${st.res === key}">`
    + `${label}<span class="num">${counts[key].toLocaleString()}</span></button>`
  ).join('');
  seg.hidden = false;
}

function renderReasons(show) {
  const box = document.getElementById('prefilter-reasons');
  if (!show) {
    box.hidden = true;
    return;
  }
  const failed = ROWS.filter(row =>
    !row.blocked && row.prefilter && !row.prefilter.pass
    && nicheMatch(row) && (st.src === 'all' || row.source === st.src)
  );
  const counts = {};
  for (const row of failed) {
    const reason = row.prefilter.reason;
    counts[reason] = (counts[reason] || 0) + 1;
  }
  const selected = selectedReasons();
  const allActive = selected === null;
  const chips = Object.entries(counts)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([reason, count]) => `<button type="button" class="chip" data-reason="${esc(reason)}" `
      + `aria-pressed="${allActive || selected.includes(reason)}">${esc(reason)}`
      + `<span class="cnt num">${count.toLocaleString()}</span></button>`)
    .join('');
  box.innerHTML = `<button type="button" class="chip" data-reason="all" `
    + `aria-pressed="${allActive}">All<span class="cnt num">${failed.length.toLocaleString()}</span></button>`
    + chips;
  box.hidden = false;
}

function render() {
  const prefilterView = st.view === PREFILTER_SLUG;
  const keywordView = st.view === KEYWORD_SLUG;
  const drView = st.view === DR_SLUG;
  const liveView = st.view === LIVE_SLUG;
  const waybackView = st.view === WAYBACK_SLUG;
  const collectionView = st.view === COLLECTION_SLUG;
  const evaluationView = st.view === EVALUATION_SLUG;
  if (!sortsFor(st.view).has(st.sort)) {
    st.sort = 'domain';
    st.dir = 1;
  }

  const key = [st.view, st.niche, st.src, st.res, st.reasons, st.kres, st.dres, st.lres, st.wres, st.cres, st.eres, st.q, st.pend, st.sort, st.dir].join('|');
  if (key !== lastKey) {
    lastKey = key;
    limit = 200;
  }

  const rows = currentRows().sort(compare);
  shown = rows;
  const page = rows.slice(0, limit);

  const cols = prefilterView
    ? (st.res === 'fail' ? PREFILTER_FAILED_COLUMNS : PREFILTER_PASSED_COLUMNS)
    : keywordView ? KEYWORD_COLUMNS
      : drView ? DR_COLUMNS
        : liveView ? LIVE_COLUMNS
          : waybackView ? WAYBACK_COLUMNS
            : collectionView ? COLLECTION_COLUMNS
              : evaluationView ? EVALUATION_COLUMNS : DISCOVERY_COLUMNS;
  const classFor = key => key === 'niche' ? 'c-niche'
    : key === 'collected' ? 'c-collected'
      : key === 'reached' ? 'c-progress'
        : key === 'price' ? 'c-price'
          : key === 'bid_end_at' ? 'c-bid-end'
            : key === 'pass' ? 'c-pass'
              : key === 'keyword' ? 'c-pass'
                : key === 'dr' ? 'c-pass'
                  : key === 'live' ? 'c-pass'
                    : key === 'wayback' ? 'c-pass'
                      : key === 'collection_status' ? 'c-pass'
                  : key === 'collection_at' ? 'c-collected'
                    : key === 'coverage' ? 'c-coverage'
                      : key === 'live_links' ? 'c-links'
                        : key === 'live_refdomains' ? 'c-refdomains'
                          : key === 'collection_units' ? 'c-units'
                            : key === 'requests_ok' ? 'c-requests'
                              : key === 'evaluation' ? 'c-pass'
                                : key === 'score' ? 'c-units'
                                  : key === 'evidence' ? 'c-units'
                                    : key === 'recommendation' ? 'c-reason'
                                      : key === 'reason' ? 'c-reason' : '';
  document.querySelector('#tbl thead tr').innerHTML = cols.map(([key, label]) => {
    const sorted = st.sort === key
      ? ` aria-sort="${st.dir > 0 ? 'ascending' : 'descending'}"`
      : '';
    return `<th data-k="${key}" class="${classFor(key)}"${sorted}><button type="button">${label}</button></th>`;
  }).join('');

  document.querySelector('#tbl tbody').innerHTML = page.map(row => {
    if (evaluationView) {
      const evaluation = row.evaluation;
      const verdict = evaluation ? evaluation.verdict : '';
      const processing = !evaluation || !verdict;
      const verdictTag = processing
        ? '<span class="oc">… Processing</span>'
        : verdict === 'Buy'
          ? '<span class="oc pass">✓ Buy</span>'
          : verdict === 'Maybe'
            ? '<span class="oc">… Maybe</span>'
            : verdict === 'Reject'
              ? '<span class="oc fail">✕ Reject</span>'
              : `<span class="tag">${esc(verdict)}</span>`;
      const score = evaluation && evaluation.score != null
        ? Number(evaluation.score).toLocaleString(undefined, { maximumFractionDigits: 1 })
        : '—';
      const evidence = evaluation && evaluation.evidence_points != null
        ? Number(evaluation.evidence_points).toLocaleString(undefined, { maximumFractionDigits: 1 })
        : '—';
      const recommendation = evaluation && evaluation.recommendation
        ? evaluation.recommendation : '—';
      const recommendationTag = recommendation === 'Buy'
        ? '<span class="oc pass">Buy</span>'
        : recommendation === 'Reject'
          ? '<span class="oc fail">Reject</span>'
          : `<span class="tag">${esc(recommendation)}</span>`;
      const reason = evaluation && evaluation.reason
        ? ` data-tip="${esc(evaluation.reason)}" tabindex="0"` : '';
      return `<tr data-d="${esc(row.domain)}" class="clickable">`
        + `<td class="c-dom"><button type="button" class="dom-link" data-detail="${esc(row.domain)}">${esc(row.domain)}</button></td>`
        + `<td><span class="src" title="${esc(row.source_label)}">${esc(row.source_short)}</span></td>`
        + `<td class="c-niche">${nicheTag(row)}</td>`
        + `<td class="c-price num">${formatPrice(row.price)}</td>`
        + `<td class="c-bid-end num mute">${formatBidEnd(row.bid_end_at)}</td>`
        + `<td class="c-pass"${reason}>${verdictTag}</td>`
        + `<td class="c-units num">${score}</td>`
        + `<td class="c-units num">${evidence}</td>`
        + `<td class="c-reason">${recommendationTag}</td>`
        + '</tr>';
    }
    if (collectionView) {
      const collection = row.collection;
      const result = collection.status === 'collected'
        ? '<span class="oc pass">✓ Collected</span>'
        : collection.status === 'failed'
          ? '<span class="oc fail">✕ Failed</span>'
          : '<span class="oc">… Queued</span>';
      const error = collection.error
        ? ` data-tip="${esc(collection.error)}" tabindex="0"` : '';
      const coverageBits = [
        collection.coverage_mode,
        collection.all_time_links == null ? '' : `${collection.all_time_links.toLocaleString()} all-time links`,
        collection.all_time_refdomains == null ? '' : `${collection.all_time_refdomains.toLocaleString()} all-time RDs`,
        collection.rows_unique == null ? '' : `${collection.rows_unique} unique rows`,
        collection.top_anchors == null ? '' : `${collection.top_anchors} top anchors`,
        collection.lexicon_complete == null ? '' : `lexicon ${collection.lexicon_complete ? 'complete' : 'truncated'}`,
        collection.run_id ? `run ${collection.run_id}` : ''
      ].filter(Boolean).join(' · ');
      const coverage = collection.coverage_mode
        ? `<span class="tag" title="${esc(coverageBits)}">${esc(collection.coverage_mode)}</span>`
        : '<span class="none">—</span>';
      const links = collection.live_links == null
        ? '—' : Number(collection.live_links).toLocaleString();
      const refdomains = collection.live_refdomains == null
        ? '—' : Number(collection.live_refdomains).toLocaleString();
      const units = collection.units ? Number(collection.units).toLocaleString() : '—';
      const requests = collection.requests_total
        ? `${collection.requests_ok}/${collection.requests_total}` : '—';
      return `<tr data-d="${esc(row.domain)}" class="clickable">`
        + `<td class="c-dom"><button type="button" class="dom-link" data-detail="${esc(row.domain)}">${esc(row.domain)}</button></td>`
        + `<td><span class="src" title="${esc(row.source_label)}">${esc(row.source_short)}</span></td>`
        + `<td class="c-niche">${nicheTag(row)}</td>`
        + `<td class="c-pass"${error}>${result}</td>`
        + `<td class="c-collected num mute" title="${esc(collection.run_id)}">${formatBidEnd(collection.fetched_at)}</td>`
        + `<td class="c-coverage">${coverage}</td>`
        + `<td class="c-links num">${links}</td>`
        + `<td class="c-refdomains num">${refdomains}</td>`
        + `<td class="c-units num">${units}</td>`
        + `<td class="c-requests num">${requests}</td>`
        + '</tr>';
    }

    if (prefilterView) {
      const result = row.prefilter || {pass: false, reason: '', manual: false};
      const reason = `<span class="tag" title="${esc(result.reason)}">${esc(result.reason)}</span>`;
      const passAction = !result.pass && WRITABLE
        ? ` <button type="button" class="link pass-action" data-pass="${esc(row.domain)}" title="Pass this domain manually">Pass</button>`
        : '';
      const resultTag = result.pass
        ? `<span class="oc pass">✓ Passed</span>${result.manual ? ' <span class="tag">Manual</span>' : ''}`
        : `<span class="oc fail">✕ Failed</span>`;
      return `<tr data-d="${esc(row.domain)}">`
        + `<td class="c-dom"><span class="dom">${esc(row.domain)}</span></td>`
        + `<td><span class="src" title="${esc(row.source_label)}">${esc(row.source_short)}</span></td>`
        + `<td class="c-niche">${nicheTag(row)}</td>`
        + `<td class="c-price num">${formatPrice(row.price)}</td>`
        + `<td class="c-bid-end num mute">${formatBidEnd(row.bid_end_at)}</td>`
        + `<td class="c-pass">${resultTag}${passAction}</td>`
        + (st.res === 'fail' ? `<td class="c-reason">${reason}</td>` : '')
        + '</tr>';
    }

    if (keywordView) {
      const check = row.keyword_check;
      const queued = !check;
      const processing = queued || check.status === 'processing';
      const resultTag = processing
        ? '<span class="oc">… Processing</span>'
        : check.reusable
          ? '<span class="oc pass">✓ Passed</span>'
          : '<span class="oc fail">✕ Failed</span>';
      const confidence = check && !processing && check.confidence != null
        ? ` <span class="tag" title="Confidence">${Math.round(Number(check.confidence) * 100)}%</span>`
        : '';
      const reason = check && !processing && check.reason
        ? ` data-tip="${esc(check.reason)}" tabindex="0"`
        : '';
      return `<tr data-d="${esc(row.domain)}">`
        + `<td class="c-dom"><span class="dom">${esc(row.domain)}</span></td>`
        + `<td><span class="src" title="${esc(row.source_label)}">${esc(row.source_short)}</span></td>`
        + `<td class="c-niche">${nicheTag(row)}</td>`
        + `<td class="c-price num">${formatPrice(row.price)}</td>`
        + `<td class="c-bid-end num mute">${formatBidEnd(row.bid_end_at)}</td>`
        + `<td class="c-pass"${reason}>${resultTag}${confidence}</td>`
        + '</tr>';
    }

    if (drView) {
      const check = row.dr_check;
      const processing = !check || check.status === 'processing';
      const resultTag = processing
        ? '<span class="oc">… Processing</span>'
        : check.passed
          ? '<span class="oc pass">✓ Passed</span>'
          : '<span class="oc fail">✕ Failed</span>';
      const rating = check && !processing && check.rating != null
        ? ` <span class="tag" title="Ahrefs Domain Rating">DR ${Number(check.rating).toLocaleString(undefined, { maximumFractionDigits: 2 })}</span>`
        : '';
      const reason = check && !processing && check.reason
        ? ` data-tip="${esc(check.reason)}" tabindex="0"`
        : '';
      return `<tr data-d="${esc(row.domain)}">`
        + `<td class="c-dom"><span class="dom">${esc(row.domain)}</span></td>`
        + `<td><span class="src" title="${esc(row.source_label)}">${esc(row.source_short)}</span></td>`
        + `<td class="c-niche">${nicheTag(row)}</td>`
        + `<td class="c-price num">${formatPrice(row.price)}</td>`
        + `<td class="c-bid-end num mute">${formatBidEnd(row.bid_end_at)}</td>`
        + `<td class="c-pass"${reason}>${resultTag}${rating}</td>`
        + '</tr>';
    }

    if (liveView) {
      const check = row.live_check;
      const processing = !check || check.status === 'processing';
      const resultTag = processing
        ? '<span class="oc">… Processing</span>'
        : check.passed
          ? '<span class="oc pass">✓ Passed</span>'
          : '<span class="oc fail">✕ Failed</span>';
      const manual = check && !processing && check.manual
        ? ' <span class="tag">Manual</span>'
        : '';
      const klass = check && !processing && check.class
        ? ` <span class="tag" title="Live check class">${esc(check.class)}</span>`
        : '';
      const host = check && !processing && check.final_host
        ? ` <span class="tag" title="Final host">${esc(check.final_host)}</span>`
        : '';
      const status = check && !processing && check.http_status != null
        ? ` <span class="tag" title="HTTP status">${detailInt(check.http_status)}</span>`
        : '';
      const reason = check && !processing && check.reason
        ? ` data-tip="${esc(check.reason)}" tabindex="0"`
        : '';
      const passAction = check && !processing && !check.passed && WRITABLE
        ? ` <button type="button" class="link pass-action" data-live-pass="${esc(row.domain)}" title="Pass this Live result manually">Pass</button>`
        : '';
      return `<tr data-d="${esc(row.domain)}">`
        + `<td class="c-dom"><span class="dom">${esc(row.domain)}</span></td>`
        + `<td><span class="src" title="${esc(row.source_label)}">${esc(row.source_short)}</span></td>`
        + `<td class="c-niche">${nicheTag(row)}</td>`
        + `<td class="c-price num">${formatPrice(row.price)}</td>`
        + `<td class="c-bid-end num mute">${formatBidEnd(row.bid_end_at)}</td>`
        + `<td class="c-pass"${reason}>${resultTag}${manual}${klass}${host}${status}${passAction}</td>`
        + '</tr>';
    }

    if (waybackView) {
      const check = row.wayback_check;
      const processing = !check || check.status === 'processing';
      const resultTag = processing
        ? '<span class="oc">… Processing</span>'
        : check.passed
          ? '<span class="oc pass">✓ Passed</span>'
          : '<span class="oc fail">✕ Failed</span>';
      const manual = check && !processing && check.manual
        ? ' <span class="tag">Manual</span>'
        : '';
      const score = check && !processing && check.score != null
        ? ` <span class="tag" title="${check.manual ? 'Automated score before manual pass' : 'Weighted Wayback score'}">${Number(check.score).toLocaleString()}%</span>`
        : '';
      const age = check && !processing && check.age_years != null
        ? ` <span class="tag" title="Archive age">${Number(check.age_years).toLocaleString(undefined, { maximumFractionDigits: 1 })} yrs</span>`
        : '';
      const source = check && !processing && check.source
        ? ` <span class="tag" title="Verdict decided by">${esc(check.source)}</span>`
        : '';
      const reason = check && !processing && check.reason
        ? ` data-tip="${esc(check.reason)}" tabindex="0"`
        : '';
      const passAction = check && !processing && !check.passed && WRITABLE
        ? ` <button type="button" class="link pass-action" data-wayback-pass="${esc(row.domain)}" title="Pass this Wayback result manually">Pass</button>`
        : '';
      return `<tr data-d="${esc(row.domain)}">`
        + `<td class="c-dom"><span class="dom">${esc(row.domain)}</span></td>`
        + `<td><span class="src" title="${esc(row.source_label)}">${esc(row.source_short)}</span></td>`
        + `<td class="c-niche">${nicheTag(row)}</td>`
        + `<td class="c-price num">${formatPrice(row.price)}</td>`
        + `<td class="c-bid-end num mute">${formatBidEnd(row.bid_end_at)}</td>`
        + `<td class="c-pass"${reason}>${resultTag}${manual}${score}${age}${source}${passAction}</td>`
        + '</tr>';
    }

    const blocked = !!row.blocked;
    const progressTitle = blocked
      ? `Rejected by the blocklist: ${row.blocked_label || row.blocked_category}`
      : row.evaluation
        ? `Purchase evaluation: ${row.evaluation.verdict || 'pending'} (score ${row.evaluation.score ?? '—'}, evidence ${row.evaluation.evidence_points ?? '—'}): ${row.evaluation.reason || ''}`
        : row.wayback_check
        ? row.wayback_check.status === 'processing'
          ? 'Wayback check is waiting for the archive'
          : `Wayback ${row.wayback_check.passed ? 'passed' : 'failed'} (${row.wayback_check.score ?? '—'}%): ${row.wayback_check.reason || ''}`
        : row.live_check
          ? row.live_check.status === 'processing'
            ? 'Live check is probing DNS and HTTP'
            : `Live ${row.live_check.passed ? 'passed' : 'failed'} (${row.live_check.class || '—'}): ${row.live_check.reason || ''}`
          : row.dr_check
          ? row.dr_check.status === 'processing'
            ? 'DR check is waiting for the free Ahrefs endpoint'
            : `DR ${row.dr_check.passed ? 'passed' : 'failed'}: ${row.dr_check.reason || ''}`
          : row.keyword_check
          ? row.keyword_check.status === 'processing'
            ? 'Keyword check is waiting for the LLM'
            : `Keyword ${row.keyword_check.reusable ? 'passed' : 'failed'}: ${row.keyword_check.reason || ''}`
          : row.prefilter
            ? `Pre-filter ${row.prefilter.pass ? 'passed' : 'failed'}: ${row.prefilter.reason || ''}`
            : row.niche === 'pending'
              ? 'Awaiting niche classification'
              : row.reached === 0
                ? 'Collected, waiting for pre-filter'
                : `Reached stage ${row.reached} of 7`;
    const progressClass = blocked
      ? 'blocked'
      : row.evaluation
        ? (row.evaluation.verdict === 'Reject' ? 'fail' : 'pass')
        : row.wayback_check
        ? (row.wayback_check.status === 'processing'
          ? ''
          : row.wayback_check.passed ? 'pass' : 'fail')
        : row.live_check
          ? (row.live_check.status === 'processing'
            ? ''
            : row.live_check.passed ? 'pass' : 'fail')
          : row.dr_check
          ? (row.dr_check.status === 'processing'
            ? ''
            : row.dr_check.passed ? 'pass' : 'fail')
          : row.keyword_check
          ? (row.keyword_check.status === 'processing'
            ? ''
            : row.keyword_check.reusable ? 'pass' : 'fail')
          : row.prefilter
            ? (row.prefilter.pass ? 'pass' : 'fail')
            : row.niche === 'pending' ? '' : 'pass';
    return `<tr data-d="${esc(row.domain)}"${blocked ? ' class="blocked-row"' : ''}>`
      + `<td class="c-dom"><span class="dom">${esc(row.domain)}</span></td>`
      + `<td><span class="src" title="${esc(row.source_label)}">${esc(row.source_short)}</span></td>`
      + `<td class="c-niche">${nicheTag(row)}</td>`
      + `<td class="c-collected num mute">${esc(row.collected || '—')}</td>`
      + `<td class="c-progress" title="${esc(progressTitle)}">${dots(row.reached)}<span class="oc ${progressClass}">${esc(row.progress_label)}</span></td>`
      + '</tr>';
  }).join('');

  const more = document.getElementById('more');
  more.hidden = rows.length <= limit;
  if (!more.hidden) more.textContent = `Show more · ${(rows.length - limit).toLocaleString()} left`;

  const blockedView = st.view === 'blocked';
  const narrowlyFiltered = Boolean(
    st.q || st.niche !== 'all' || st.src !== 'all'
    || (prefilterView
      ? (st.res === 'fail' && st.reasons !== 'all')
      : keywordView ? st.kres !== 'processing'
        : drView ? st.dres !== 'processing'
          : liveView ? st.lres !== 'processing'
            : waybackView ? st.wres !== 'processing'
              : collectionView ? st.cres !== 'queued'
                : evaluationView ? st.eres !== 'passed' : st.pend)
  );
  const filtered = Boolean(
    st.q || st.niche !== 'all' || st.src !== 'all'
    || (prefilterView ? st.res === 'fail'
      : keywordView ? st.kres !== 'processing'
        : drView ? st.dres !== 'processing'
          : liveView ? st.lres !== 'processing'
            : waybackView ? st.wres !== 'processing'
              : collectionView ? st.cres !== 'queued'
                : evaluationView ? st.eres !== 'passed' : st.pend)
  );
  const empty = document.getElementById('empty');
  empty.hidden = rows.length > 0;
  if (!empty.hidden) {
    if (blockedView) {
      document.getElementById('empty-h').textContent = 'No blocked domains';
      document.getElementById('empty-p').textContent = 'No stored domain matched the blocklist dictionary.';
    } else if (evaluationView) {
      document.getElementById('empty-h').textContent = narrowlyFiltered
        ? 'No matches'
        : `No ${EVALUATION_FILTERS[st.eres].toLowerCase()} evaluations`;
      document.getElementById('empty-p').textContent = narrowlyFiltered
        ? 'Try clearing the search or filters.'
        : st.eres === 'passed'
          ? 'No collected domain has passed the purchase evaluation yet.'
          : 'No collected domain has been rejected by the purchase evaluation yet.';
    } else if (collectionView) {
      document.getElementById('empty-h').textContent = narrowlyFiltered
        ? 'No matches'
        : `No ${COLLECTION_FILTERS[st.cres].toLowerCase()} domains`;
      document.getElementById('empty-p').textContent = narrowlyFiltered
        ? 'Try clearing the search or filters.'
        : st.cres === 'queued'
          ? 'The worker collects DR-passed domains automatically when data collection is enabled.'
          : st.cres === 'failed'
            ? 'No Ahrefs run has failed yet.'
            : 'No DR-passed domain has finished Ahrefs collection yet.';
    } else if (prefilterView) {
      document.getElementById('empty-h').textContent = narrowlyFiltered
        ? 'No matches'
        : (st.res === 'fail' ? 'No failed domains' : 'No passed domains');
      document.getElementById('empty-p').textContent = narrowlyFiltered
        ? 'Try clearing the search or filters.'
        : 'The worker prefilters classified domains automatically.';
    } else if (keywordView) {
      document.getElementById('empty-h').textContent = narrowlyFiltered
        ? 'No matches'
        : `No ${KEYWORD_FILTERS[st.kres].toLowerCase()} keywords`;
      document.getElementById('empty-p').textContent = narrowlyFiltered
        ? 'Try clearing the search or filters.'
        : st.kres === 'processing'
          ? 'The worker has no keywords waiting for the LLM right now.'
          : `No keyword has ${st.kres === 'passed' ? 'passed' : 'failed'} the LLM check yet.`;
    } else if (drView) {
      document.getElementById('empty-h').textContent = narrowlyFiltered
        ? 'No matches'
        : `No ${DR_FILTERS[st.dres].toLowerCase()} DR checks`;
      document.getElementById('empty-p').textContent = narrowlyFiltered
        ? 'Try clearing the search or filters.'
        : st.dres === 'processing'
          ? 'The worker has no keyword-passed domains waiting for a DR check right now.'
          : `No domain has ${st.dres === 'passed' ? 'passed' : 'failed'} the DR check yet.`;
    } else if (liveView) {
      document.getElementById('empty-h').textContent = narrowlyFiltered
        ? 'No matches'
        : `No ${LIVE_FILTERS[st.lres].toLowerCase()} Live checks`;
      document.getElementById('empty-p').textContent = narrowlyFiltered
        ? 'Try clearing the search or filters.'
        : st.lres === 'processing'
          ? 'The worker has no DR-passed domains waiting for a Live check right now.'
          : `No domain has ${st.lres === 'passed' ? 'passed' : 'failed'} the Live check yet.`;
    } else if (waybackView) {
      document.getElementById('empty-h').textContent = narrowlyFiltered
        ? 'No matches'
        : `No ${WAYBACK_FILTERS[st.wres].toLowerCase()} Wayback checks`;
      document.getElementById('empty-p').textContent = narrowlyFiltered
        ? 'Try clearing the search or filters.'
        : st.wres === 'processing'
          ? 'The worker has no DR-passed domains waiting for a Wayback check right now.'
          : st.wres === 'connection_failed'
            ? 'No domain has a zero-score Wayback connection or archive failure.'
            : `No domain has ${st.wres === 'passed' ? 'passed' : 'failed'} the Wayback checks yet.`;
    } else {
      document.getElementById('empty-h').textContent = narrowlyFiltered
        ? 'No matches'
        : 'No domains discovered';
      document.getElementById('empty-p').textContent = narrowlyFiltered
        ? 'Try clearing the search or filters.'
        : 'Import a candidate export to populate the discovery list.';
    }
    document.getElementById('empty-clear').hidden = blockedView || !filtered;
  }

  document.getElementById('count').textContent = rows.length.toLocaleString();
  document.getElementById('pendn').textContent = rows.filter(row => row.niche === 'pending').length.toLocaleString();
  document.getElementById('pend-chip').hidden = prefilterView || keywordView || drView || liveView || waybackView || collectionView || evaluationView;
  document.getElementById('clear').hidden = !filtered;
  document.getElementById('vtitle').textContent = sourceLabel(st.view)
    + (keywordView ? ' · ' + KEYWORD_FILTERS[st.kres] : '')
    + (drView ? ' · ' + DR_FILTERS[st.dres] : '')
    + (liveView ? ' · ' + LIVE_FILTERS[st.lres] : '')
    + (waybackView ? ' · ' + WAYBACK_FILTERS[st.wres] : '')
    + (collectionView ? ' · ' + COLLECTION_FILTERS[st.cres] : '')
    + (evaluationView ? ' · ' + EVALUATION_FILTERS[st.eres] : '')
    + (!blockedView && st.niche !== 'all' ? ' · ' + (NICHE_LABELS[st.niche] || st.niche) : '');

  renderSidebar();
  renderPipeline();
  renderSeg(prefilterView, keywordView, collectionView, drView, liveView, waybackView, evaluationView);
  renderReasons(prefilterView && st.res === 'fail');
  sync();
}

function sync() {
  const params = new URLSearchParams();
  for (const key of ['view', 'niche', 'src', 'res', 'reasons', 'kres', 'dres', 'lres', 'wres', 'cres', 'eres', 'q', 'pend', 'sort', 'dir']) {
    if (key === 'reasons' && (st.view !== PREFILTER_SLUG || st.res !== 'fail' || st.reasons === 'all')) {
      continue;
    }
    if (key === 'kres' && (st.view !== KEYWORD_SLUG || st.kres === DEF.kres)) {
      continue;
    }
    if (key === 'dres' && (st.view !== DR_SLUG || st.dres === DEF.dres)) {
      continue;
    }
    if (key === 'lres' && (st.view !== LIVE_SLUG || st.lres === DEF.lres)) {
      continue;
    }
    if (key === 'wres' && (st.view !== WAYBACK_SLUG || st.wres === DEF.wres)) {
      continue;
    }
    if (key === 'cres' && (st.view !== COLLECTION_SLUG || st.cres === DEF.cres)) {
      continue;
    }
    if (key === 'eres' && (st.view !== EVALUATION_SLUG || st.eres === DEF.eres)) {
      continue;
    }
    if (String(st[key]) !== String(DEF[key])) params.set(key, st[key]);
  }
  const hash = params.toString();
  history.replaceState(null, '', hash ? '#' + hash : location.pathname + location.search);
}

function resetFilters() {
  st.q = '';
  st.niche = 'all';
  st.src = 'all';
  st.res = 'pass';
  st.reasons = 'all';
  st.kres = 'processing';
  st.dres = 'processing';
  st.lres = 'processing';
  st.wres = 'processing';
  st.cres = 'queued';
  st.eres = 'passed';
  st.pend = 0;
  document.getElementById('f-q').value = '';
  document.getElementById('f-niche').value = 'all';
  document.getElementById('f-src').value = 'all';
  document.getElementById('f-pend').checked = false;
  render();
}

function initControls() {
  const niche = document.getElementById('f-niche');
  niche.innerHTML = [
    '<option value="all">any</option>',
    ...META.niches.map(item => `<option value="${esc(item.value)}">${esc(item.label)}</option>`)
  ].join('');
  niche.value = st.niche;

  const source = document.getElementById('f-src');
  source.innerHTML = '<option value="all">any</option>'
    + META.sources.map(item => `<option value="${esc(item.slug)}">${esc(item.label)}</option>`).join('');
  source.value = st.src;

  document.getElementById('f-q').value = st.q;
  document.getElementById('f-pend').checked = !!st.pend;

  const generated = document.getElementById('generated');
  generated.textContent = 'Generated ' + META.generated_at.replace('T', ' ').replace('+00:00', ' UTC');
  generated.title = META.db_path;
  document.getElementById('db-path').textContent = 'Index: ' + META.db_path;

  const collection = META.data_collection || {};
  const budget = document.getElementById('collection-budget');
  if (budget) {
    const spent = Number(collection.spent || 0).toLocaleString();
    const allowed = Number(collection.allowed || 0).toLocaleString();
    const cap = Number(collection.monthly_cap || 0).toLocaleString();
    const reserve = Number(collection.reserve || 0).toLocaleString();
    budget.textContent = `Ahrefs units: ${spent} / ${allowed} this month`
      + (collection.enabled ? '' : ' · paused');
    budget.title = `Monthly cap ${cap}; reserve ${reserve}`;
  }
}

document.getElementById('source-views').addEventListener('click', event => {
  const button = event.target.closest('[data-view]');
  if (!button) return;
  st.view = button.dataset.view;
  render();
});
document.getElementById('pipeline-views').addEventListener('click', event => {
  const button = event.target.closest('[data-view]');
  if (!button) return;
  st.view = button.dataset.view;
  if (st.view === PREFILTER_SLUG) {
    st.res = 'pass';
    st.reasons = 'all';
  }
  if (st.view === KEYWORD_SLUG && !Object.hasOwn(KEYWORD_FILTERS, st.kres)) {
    st.kres = 'processing';
  }
  if (st.view === DR_SLUG && !Object.hasOwn(DR_FILTERS, st.dres)) {
    st.dres = 'processing';
  }
  if (st.view === LIVE_SLUG && !Object.hasOwn(LIVE_FILTERS, st.lres)) {
    st.lres = 'processing';
  }
  if (st.view === WAYBACK_SLUG && !Object.hasOwn(WAYBACK_FILTERS, st.wres)) {
    st.wres = 'processing';
  }
  if (st.view === COLLECTION_SLUG && !Object.hasOwn(COLLECTION_FILTERS, st.cres)) {
    st.cres = 'queued';
  }
  if (st.view === EVALUATION_SLUG && !Object.hasOwn(EVALUATION_FILTERS, st.eres)) {
    st.eres = 'passed';
  }
  render();
});

    st.cres = collectionButton.dataset.cres;
    render();
    return;
  }
  const drButton = event.target.closest('[data-dres]');
  if (drButton) {
    st.dres = drButton.dataset.dres;
    render();
    return;
  }
  const liveButton = event.target.closest('[data-lres]');
  if (liveButton) {
    st.lres = liveButton.dataset.lres;
    render();
    return;
  }
  const waybackButton = event.target.closest('[data-wres]');
  if (waybackButton) {
    st.wres = waybackButton.dataset.wres;
    render();

  }
  const keywordButton = event.target.closest('[data-kres]');

    st.kres = keywordButton.dataset.kres;

document.getElementById('prefilter-reasons').addEventListener('click', event => {
  const button = event.target.closest('[data-reason]');
  if (!button) return;
  const reason = button.dataset.reason;
  if (reason === 'all') {
    st.reasons = 'all';
  } else if (st.reasons === 'all') {
    st.reasons = reason;
  } else {
    const current = selectedReasons() || [];
    const next = current.includes(reason)
      ? current.filter(value => value !== reason)
      : [...current, reason];
    st.reasons = next.length ? next.join(',') : 'all';
  }
  render();
});
document.getElementById('f-q').addEventListener('input', event => {
  st.q = event.target.value;
  render();
});
document.getElementById('f-niche').addEventListener('change', event => {
  st.niche = event.target.value;
  render();
});
document.getElementById('f-src').addEventListener('change', event => {
  st.src = event.target.value;
  render();
});
document.getElementById('f-pend').addEventListener('change', event => {
  st.pend = event.target.checked ? 1 : 0;
  render();
});
document.getElementById('clear').addEventListener('click', resetFilters);
document.getElementById('empty-clear').addEventListener('click', resetFilters);
document.getElementById('more').addEventListener('click', () => {
  limit += 200;
  render();
});

document.querySelector('#tbl tbody').addEventListener('click', event => {
  const button = event.target.closest('button');
  if (button && !button.dataset.detail) return;
  const row = event.target.closest('tr[data-d]');
  if (!row || !row.classList.contains('clickable')) return;
  openDomainDetail(row.dataset.d);
});

  document.getElementById('detail-close').addEventListener('click', closeDomainDetail);
  detailDialog.addEventListener('click', event => {
    if (event.target === detailDialog) closeDomainDetail();
  });
  detailDialog.addEventListener('close', () => {
    detailBody.innerHTML = '';
  });
}

document.querySelector('#tbl tbody').addEventListener('click', async event => {
  const button = event.target.closest('[data-pass]');
  if (!button) return;
  const domain = button.dataset.pass;
  if (!window.confirm(`Pass ${domain} manually?`)) return;
  button.disabled = true;
  try {
    const response = await fetch(
      `/api/prefilter/${encodeURIComponent(domain)}/pass`,
      { method: 'POST' }
    );
    if (!response.ok) throw new Error(await response.text());
    const row = ROWS.find(item => item.domain === domain);
    if (row) {
      row.prefilter = { pass: true, reason: 'Manually passed', manual: true };
      row.progress_label = 'Passed pre-filter (manual)';
      row.reached = 1;
    }
    render();
  } catch (error) {
    console.error(error);
    button.disabled = false;
    button.textContent = 'Retry';
  }
});
document.querySelector('#tbl tbody').addEventListener('click', async event => {

    const response = await fetch(
      `/api/live/${encodeURIComponent(domain)}/pass`,
      { method: 'POST' }
    );
    if (!response.ok) throw new Error(await response.text());
    const row = ROWS.find(item => item.domain === domain);
    if (row && row.live_check) {
      row.live_check = {
        ...row.live_check,

      row.reached = Math.max(Number(row.reached || 0), 4);

    render();
  } catch (error) {
    console.error(error);
    button.disabled = false;
    button.textContent = 'Retry';
  }
});

document.querySelector('#tbl thead').addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  const key = button.parentElement.dataset.k;
  if (st.sort === key) st.dir *= -1;
  else {
    st.sort = key;
    st.dir = 1;
  }
  render();
});
document.addEventListener('keydown', event => {
  if (event.key === '/' && !event.target.matches('input,select,textarea')) {
    event.preventDefault();
    document.getElementById('f-q').focus();
  }
});

const tip = document.getElementById('tip');
let tipTarget = null;

function placeTip(x, y) {
  const pad = 12;
  const gap = 14;
  const rect = tip.getBoundingClientRect();
  let left = x + gap;
  let top = y + gap;
  if (left + rect.width > window.innerWidth - pad) {
    left = Math.max(pad, x - rect.width - gap);
  }
  if (top + rect.height > window.innerHeight - pad) {
    top = Math.max(pad, y - rect.height - gap);
  }
  tip.style.left = `${left}px`;
  tip.style.top = `${top}px`;
}

function showTip(target, x, y) {
  tipTarget = target;
  tip.textContent = target.dataset.tip;
  tip.hidden = false;
  placeTip(x, y);
}

function hideTip() {
  tipTarget = null;
  tip.hidden = true;
}

document.addEventListener('pointerover', event => {
  const target = event.target.closest('[data-tip]');
  if (!target || !target.dataset.tip) return;
  showTip(target, event.clientX, event.clientY);
});
document.addEventListener('pointermove', event => {
  if (!tipTarget) return;
  const target = event.target.closest('[data-tip]');
  if (target !== tipTarget) {
    hideTip();
    return;
  }
  placeTip(event.clientX, event.clientY);
});
document.addEventListener('pointerout', event => {
  const target = event.target.closest('[data-tip]');
  if (target && !target.contains(event.relatedTarget)) hideTip();
});
document.addEventListener('focusin', event => {
  const target = event.target.closest('[data-tip]');
  if (!target || !target.dataset.tip) return;
  const rect = target.getBoundingClientRect();
  showTip(target, rect.left + rect.width / 2, rect.top);
});
document.addEventListener('focusout', event => {
  if (event.target.closest('[data-tip]')) hideTip();
});
window.addEventListener('scroll', hideTip, true);

initControls();
render();
</script>
